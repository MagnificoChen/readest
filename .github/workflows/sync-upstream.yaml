name: Sync fork with upstream

on:
  schedule:
    - cron: '0 2 * * *'    # 每天 UTC 02:00 跑一次，按需调整
  workflow_dispatch:        # 允许在 Actions 页面手动点击运行

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0     # 拉取完整历史，浅克隆会导致合并失败

      - name: Add upstream remote
        run: git remote add upstream https://github.com/ORIGINAL_OWNER/ORIGINAL_REPO.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Fast-forward merge
        run: git merge upstream/main --ff-only

      - name: Push to fork
        run: git push origin main
