name: Sync fork with upstream
on:
  schedule:
    - cron: '0 2 * * *'   # UTC 2:00 = 北京时间(UTC+8) 10:00
  workflow_dispatch:      # 允许在 Actions 页面手动点击运行

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/readest/readest.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Merge upstream into main
        run: git merge upstream/main --no-edit

      - name: Push to fork
        run: git push origin main
